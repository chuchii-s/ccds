<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDS Feasibility Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<!--CCDS_DATA-->
<style>
:root {
  --navy: #1e3a5f; --navy-l: #e8eef6; --navy-t: #bfd3ea;
  --teal: #0f766e; --teal-l: #e6f4f2;
  --green: #15803d; --green-l: #e7f6ec;
  --red: #b91c1c; --red-l: #fdecec;
  --amber: #b45309; --gold: #f59e0b;
  --text: #1f2937; --muted: #6b7280; --line: #d6dce4; --stripe: #f7f9fc;
  --bg: #f3f5f9; --card: #fff; --total: #fff4c2; --total-b: #e0b100;
  --th-bg: #eef3f9; --th-fg: #1e3a5f; --total-bg: #f1f5fb; --total-line: #1e3a5f; --track: #eef2f7; --blue: #1f5aa6;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Sarabun", "Leelawadee UI", "Leelawadee", Tahoma, sans-serif; font-size: 15px; color: var(--text); background: var(--bg); }
.pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--muted); }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding: 10px 24px; background: var(--navy); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.brand .title { font-size: 20px; font-weight: 700; }
.brand .sub { font-size: 13px; color: var(--navy-t); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.actions .lbl { font-size: 13px; color: var(--navy-t); }
.actions .sep { width: 1px; height: 24px; background: rgba(255,255,255,.25); margin: 0 4px; }
.btn { font: inherit; font-size: 14px; cursor: pointer; border-radius: 6px; padding: 6px 14px; border: 1px solid transparent; }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.3); }
.btn.ghost:hover { background: rgba(255,255,255,.18); }
.btn.primary { background: var(--gold); color: #1f2937; font-weight: 700; }
.btn.primary:hover { background: #fbbf24; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.tabs { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 8px; padding: 3px; }
.tabs button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--navy-t); padding: 5px 14px; border-radius: 6px; cursor: pointer; }
.tabs button.on { background: #fff; color: var(--navy); font-weight: 700; }
.msg { margin: 12px 24px 0; padding: 8px 12px; border-radius: 6px; background: var(--navy-l); color: var(--navy); }
.msg:empty { display: none; }

/* ---------- Edit view ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
.results { position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.card { background: var(--card); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(16,24,40,.08); border: 1px solid #e5e9f0; overflow-x: auto; }
.card h2 { margin: 0 0 12px; font-size: 17px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
.card h3 { margin: 0 0 10px; font-size: 16px; color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 4px; }
.num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 13px; flex: none; }
.grid { display: grid; gap: 10px 14px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
input { font: inherit; font-size: 15px; color: var(--text); padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; width: 100%; }
input[type=number] { text-align: right; }
select { font: inherit; font-size: 15px; color: var(--text); padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; width: 100%; cursor: pointer; }
select:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
input[type=checkbox] { width: 18px; height: 18px; }
input:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
input:disabled { background: #f3f4f6; color: var(--muted); }
input.name { width: 70px; font-weight: 600; text-align: left; }
input.name.wide { width: 130px; }
.calc.warn { background: #fff4c2; color: #7c5a00; }
.mode-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.seg.mode button { padding: 6px 14px; font-size: 14px; }
.seg.mode button.on { background: var(--navy); color: #fff; font-weight: 600; }
.mode-hint { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.calc { margin-top: 10px; padding: 8px 10px; background: var(--navy-l); border-radius: 6px; font-size: 14px; }
.mt { margin-top: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { background: var(--navy); color: #fff; font-weight: 600; text-align: left; padding: 6px 8px; font-size: 13px; }
.tbl th small { font-weight: 400; color: var(--navy-t); }
.tbl td { padding: 4px 6px; border-bottom: 1px solid #edf0f4; }
.tbl tbody tr:nth-child(even) td { background: var(--stripe); }
.tbl tfoot td { background: var(--total); font-weight: 700; border-top: 1px solid var(--total-b); border-bottom: 1px solid var(--total-b); padding: 6px 8px; }
.tbl.compact td { padding: 5px 8px; }
.tbl .r, .tbl th.r { text-align: right; }
.tbl td input[type=number] { min-width: 80px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { white-space: nowrap; font: inherit; font-size: 13px; border: 0; background: #fff; color: var(--muted); padding: 4px 10px; cursor: pointer; }
.seg button.on.powder { background: var(--teal); color: #fff; }
.ico { width: 20px; height: 20px; display: block; }
.seg.icons button { display: grid; place-items: center; width: 40px; height: 30px; padding: 0; }
.pill.icon-pill { display: inline-grid; place-items: center; width: 40px; height: 30px; padding: 0; border-radius: 6px; }
.seg button.on.gl { background: #fff1b8; color: #8a6100; box-shadow: inset 0 0 0 1px #f2d675; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 6px; background: var(--teal); color: #fff; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.x:hover { color: var(--red); }
.link { border: 0; background: none; color: var(--teal); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.kpi { border-radius: 10px; padding: 12px 14px; border-top: 4px solid; display: flex; flex-direction: column; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi b { font-size: 26px; line-height: 1.2; }
.kpi small { font-size: 12px; color: var(--muted); }
.kpi.navy { background: var(--navy-l); border-color: var(--navy); } .kpi.navy b { color: var(--navy); }
.kpi.teal { background: var(--teal-l); border-color: var(--teal); } .kpi.teal b { color: var(--teal); }
.kpi.pos { background: var(--green-l); border-color: var(--green); } .kpi.pos b { color: var(--green); }
.kpi.neg { background: var(--red-l); border-color: var(--red); } .kpi.neg b { color: var(--red); }
.facts { list-style: none; margin: 0 0 12px; padding: 0; }
.facts li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid #edf0f4; font-size: 14px; }
.facts li small { color: var(--muted); }
.facts li.total { background: var(--navy-l); padding: 7px 8px; border-radius: 6px; border: 0; margin-top: 6px; font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 44px 1fr 110px; align-items: center; gap: 8px; font-size: 13px; }
.bar-row .yr { color: var(--muted); }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 14px; background: #f1f3f6; border-radius: 3px; }
.track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #9ca3af; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.fill.pos { background: #22a05a; } .fill.pos.lease { background: #7fd1a1; }
.fill.neg { background: #e05252; } .fill.neg.lease { background: #f1a3a3; }
.panel-report { display: flex; flex-direction: column; gap: 10px; font-size: 9pt; }
.tbl-scroll { overflow-x: auto; }
.tbl-scroll .rt { min-width: 520px; }
.bars.years .bar-row, .bars.years .bar-head { grid-template-columns: 40px 1fr 84px 96px; }
.bar-head { display: grid; gap: 8px; font-size: 12px; color: var(--muted); padding-bottom: 2px; border-bottom: 1px solid #edf0f4; }
.bar-head .r { text-align: right; }
.bars.years .val.net { font-size: 12.5px; }
.bar-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

@media (max-width: 1050px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .results { position: static; max-height: none; overflow: visible; }
  .topbar { padding: 10px 16px; position: static; }
}
@media (max-width: 640px) {
  .g3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .kpi b { font-size: 21px; }
  .bar-row { grid-template-columns: 40px 1fr 90px; }
  .bars.years .bar-row, .bars.years .bar-head { grid-template-columns: 34px 1fr 70px 82px; gap: 6px; }
  .msg { margin: 12px 16px 0; }
}

/* ---------- Report view (A4) — ชุดเดียวกับ wwwroot/css/app.css ---------- */
.report-wrap { padding: 24px 16px 48px; overflow-x: auto; }
.page {
    --navy: #1e3a5f; --navy-l: #eef3f9; --teal: #0f766e; --teal-l: #e7f5f3; --green: #15803d; --green-l: #ecf7f0;
    --red: #b91c1c; --red-l: #fdf0f0; --text: #1b2433; --muted: #66748a; --line: #e3e8ef; --stripe: #f8fafc;
    --th-bg: #eef3f9; --th-fg: #1e3a5f; --total-bg: #f1f5fb; --total-line: #1e3a5f; --track: #eef2f7; --blue: #1f5aa6;
    color-scheme: light;
    width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff; padding: 10mm; border-radius: 4px;
    box-shadow: 0 10px 40px rgba(15, 27, 45, .14); display: flex; flex-direction: column;
    font-size: 9pt; line-height: 1.3; color: var(--text);
}
.page .muted { color: var(--muted); }
.page .pos { color: var(--green); }
.page .neg { color: var(--red); }
.page .content { flex: 1; display: flex; flex-direction: column; gap: 4mm; }

.ph { margin-bottom: 4mm; }
.ph-top { background: var(--navy); color: #fff; padding: 4.5mm 5mm; border-radius: 2.5mm; display: flex; justify-content: space-between; gap: 4mm;
    box-shadow: inset 0 -1.2mm 0 var(--teal); }
.ph-top .t1 { font-size: 20pt; font-weight: 700; line-height: 1.1; letter-spacing: .02em; }
.ph-top .t1 small { font-size: 12pt; font-weight: 400; color: #c3d4ea; letter-spacing: 0; }
.ph-top .t2 { font-size: 12pt; font-weight: 600; margin-top: .6mm; }
.ph-top .meta { text-align: right; font-size: 9.5pt; align-self: center; }
.ph-top .meta div + div { color: #c3d4ea; font-size: 8.5pt; }
.ph-sub { margin-top: 2mm; display: inline-block; background: var(--teal-l); color: var(--teal); font-weight: 700; font-size: 9.5pt;
    padding: 1mm 3.5mm; border-radius: 999px; }
.pf { border-top: .5pt solid var(--line); padding-top: 1.6mm; margin-top: 3mm; display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--muted); }

.r-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
.r-kpi { position: relative; padding: 3mm 3.2mm 3mm 4.2mm; border-radius: 2mm; border: .6pt solid var(--line); background: #fff; overflow: hidden; }
.r-kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 1.2mm; background: var(--k); }
.r-kpi .l { font-size: 8pt; color: var(--muted); }
.r-kpi .v { font-size: 15pt; font-weight: 700; line-height: 1.2; color: var(--k); font-variant-numeric: tabular-nums; }
.r-kpi .v small { font-size: 7.5pt; font-weight: 400; color: var(--muted); }
.r-kpi .n { font-size: 7.5pt; color: var(--muted); }
.r-kpi.navy { --k: var(--navy); }
.r-kpi.teal { --k: var(--teal); }
.r-kpi.pos { --k: var(--green); background: var(--green-l); border-color: transparent; }
.r-kpi.neg { --k: var(--red); background: var(--red-l); border-color: transparent; }

.verdict { padding: 3mm 3.6mm; border: 1.5pt solid; border-radius: 2.2mm; background: #fff; }
.verdict.pos { border-color: var(--green); color: var(--green); }
.verdict.neg { border-color: var(--red); color: var(--red); }
.verdict .h { font-weight: 700; font-size: 10pt; margin-bottom: .5mm; }

.sec { display: flex; align-items: center; gap: 2mm; font-size: 10.5pt; font-weight: 700; color: var(--navy);
    border-bottom: .6pt solid var(--line); padding-bottom: 1mm; margin-bottom: 1.8mm; }
.sec::before { content: ""; width: 1.1mm; height: 3.6mm; border-radius: .6mm; background: var(--teal); }
.cols { display: grid; gap: 5mm; }

.rt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 8.5pt; font-variant-numeric: tabular-nums; }
.rt th { background: var(--th-bg); color: var(--th-fg); font-weight: 700; font-size: 8pt; padding: 1.2mm 1.6mm; text-align: right; white-space: nowrap; }
.rt th:first-child { border-radius: 1.2mm 0 0 1.2mm; }
.rt th:last-child { border-radius: 0 1.2mm 1.2mm 0; }
.rt th.l, .rt td.l { text-align: left; }
.rt td { padding: .9mm 1.6mm; border-bottom: .5pt solid var(--line); text-align: right; }
.rt tr.sub td { background: var(--stripe); font-weight: 600; }
.rt tr.tot td { background: var(--total-bg); font-weight: 700; border-top: 1pt solid var(--total-line); border-bottom: 0; }
.rt td.neg { color: var(--red); }
.rt.small td, .rt.small th { font-size: 7.5pt; padding: .8mm 1.1mm; }
.rt .tag { display: inline-block; font-weight: 700; font-size: 7.5pt; padding: .2mm 1.6mm; border-radius: 999px; }
.rt .tag.powder { color: var(--teal); background: var(--teal-l); }
.rt .tag.gl { color: #8a6100; background: #fff1b8; }
.rt td.indent { white-space: pre; }
.rt.yt td, .rt.yt th { border-left: .5pt solid var(--line); }
.rt.yt th { border-left-color: rgba(30, 58, 95, .12); }
.rt.yt td:first-child, .rt.yt th:first-child { border-left: 0; white-space: nowrap; }
.rt.yt td.pos { color: var(--green); font-weight: 600; }
.rt.yt td.be { background: var(--green-l); font-weight: 700; }
.rt.yt th.be-h { color: var(--green); }
.rt.yt tr.cum td { font-weight: 700; }
.rt.yt td.cum { color: var(--blue); }
.saving-row { display: flex; justify-content: space-between; margin-top: 1.5mm; padding: 1.6mm 2mm; border-radius: 1.6mm; font-weight: 600; }
.saving-row.pos { background: var(--green-l); }
.saving-row.neg { background: var(--red-l); }
.saving-row b { font-weight: 700; }

.stack-l { font-weight: 700; margin-top: 1.4mm; }
.stack-l span { font-weight: 400; color: var(--muted); }
.stack { display: flex; gap: .4mm; height: 4.8mm; background: var(--track); margin-top: 1mm; border-radius: 1.2mm; overflow: hidden; }
.legend { font-size: 7.5pt; color: var(--muted); margin-top: 2mm; display: flex; flex-wrap: wrap; gap: 1mm 3mm; }
.legend i { display: inline-block; width: 7pt; height: 7pt; margin-right: 1mm; vertical-align: -1pt; border-radius: 1.5pt; }

.facts-r .f { display: flex; justify-content: space-between; align-items: center; border-bottom: .5pt solid var(--line); padding: 1.1mm 0; }
.facts-r .note { font-size: 7pt; color: var(--muted); }
.facts-r b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts-r .tot { margin-top: 1.8mm; padding: 1.8mm 2.2mm; border-radius: 1.6mm; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.facts-r .tot.pos { background: var(--green-l); }
.facts-r .tot.neg { background: var(--red-l); }
.facts-r .tot b { font-size: 11pt; }

.ychart { border: .6pt solid var(--line); border-radius: 2mm; padding: 2.4mm; background: #fff; }
.ychart .cols-y { display: flex; }
.ychart .yc { flex: 1; padding: 0 2px; display: flex; flex-direction: column; text-align: center; }
.ychart .zone { display: flex; }
.ychart .zone.p { align-items: flex-end; }
.ychart .zone.n { align-items: flex-start; }
.ychart .zone div { width: 100%; border-radius: 1px; }
.ychart .zone.p div { border-radius: 1.2mm 1.2mm 0 0; }
.ychart .zone.n div { border-radius: 0 0 1.2mm 1.2mm; }
.ychart .zero { height: 1px; background: var(--muted); opacity: .6; }
.ychart .lab { font-size: 7pt; color: var(--muted); margin-top: .8mm; }
.ychart .val { font-size: 6.5pt; font-weight: 600; }
.ychart .cap { font-size: 7pt; color: var(--muted); margin-top: 1.4mm; }
.note-box { background: var(--navy-l); padding: 2.4mm 3mm; border-radius: 2mm; }
.foot-note { font-size: 8pt; color: var(--muted); margin-top: 1.2mm; }
.foot-note b { color: var(--navy); }

/* กราฟ/ตารางรายปีในแผงขวา (ใช้คลาสเดียวกับรายงาน แต่สีตามธีมหน้าจอ) */
.panel-report .ychart { background: var(--card); border-color: var(--line); }
.panel-report .ychart .lab, .panel-report .ychart .cap { color: var(--muted); }
.panel-report .rt td { border-color: var(--line); }
.panel-report .rt td.neg, .panel-report .neg { color: var(--red); }
.panel-report .pos { color: var(--green); }

/* ---------- Print ---------- */
@page { size: A4; margin: 0; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; }
  .topbar, .msg, #edit-view { display: none !important; }
  #report-view { display: block !important; }
  .report-wrap { padding: 0; overflow: visible; }
  .page { margin: 0; box-shadow: none; border-radius: 0; height: 297mm; min-height: 0; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="title">CCDS Feasibility Simulator</div>
    <div class="sub">กรอกข้อมูล → คำนวณอัตโนมัติ → พิมพ์ / บันทึกเป็น PDF</div>
  </div>
  <div class="actions">
    <div class="tabs">
      <button data-action="view" data-view="edit">กรอกข้อมูล</button>
      <button data-action="view" data-view="report">รายงาน</button>
    </div>
    <span class="sep"></span>
    <span class="lbl">ข้อมูลตัวอย่าง:</span>
    <button class="btn ghost" data-action="preset" data-preset="S1">ตัวอย่าง 1</button>
    <button class="btn ghost" data-action="preset" data-preset="S2">ตัวอย่าง 2</button>
    <button class="btn ghost" data-action="preset" data-preset="Blank">ล้างข้อมูล</button>
    <span class="sep"></span>
    <label class="btn ghost file">เปิดไฟล์ข้อมูล<input type="file" id="file-in" accept=".json,application/json"></label>
    <button class="btn ghost" data-action="save">บันทึกข้อมูล</button>
    <button class="btn primary" data-action="print">พิมพ์ / บันทึก PDF</button>
  </div>
</header>
<div class="msg" id="msg"></div>

<main id="edit-view">
  <div class="layout">
    <section id="form"></section>
    <aside class="results" id="results"></aside>
  </div>
</main>
<main id="report-view" hidden>
  <div class="report-wrap" id="report"></div>
</main>

<script>
"use strict";
/* =====================================================================
   CCDS Feasibility Simulator (HTML)
   สูตรคำนวณเดียวกับโปรแกรม C# (Services/CcdsCalculator.cs)
   ไฟล์ข้อมูล .json ใช้รูปแบบเดียวกัน เปิดสลับกันได้
   ===================================================================== */

const KIND = { MixingA: 0, MixingB: 1, Continuous: 2 };
const STORE_KEY = "ccds-simulator-input-v1";

// ---------------- ข้อมูลตั้งต้น ----------------
function build(site, model, month, machines, t, a1, a2, a3, a6, b, priceA, priceB, leasing) {
  return {
    SiteName: site, ModelName: model, Month: month, Machines: machines, TreatmentsPerMonth: t,
    ARecipes: [
      { Name: "A1", Gallons: a1, UsePowder: false },
      { Name: "A2", Gallons: a2, UsePowder: true },
      { Name: "A3", Gallons: a3, UsePowder: false },
      { Name: "A6", Gallons: a6, UsePowder: false },
    ],
    UsageMode: 0, GallonsB: b, LitersPerTreatmentB: 0,

    CcdsPricePerGallonA: 50,

    PowderA: { CostPerBox: 1000, MixPerBox: 20, MixLiter: 5 },
    PowderB: { CostPerBox: 1100, MixPerBox: 40, MixLiter: 6 },
    IncludeUtility: true, WaterRate: 30, WaterM3Per1000Liter: 2, ElectricRate: 4.9, DaysPerMonth: 30, MixTankLiterA: 100, MixTankLiterB: 120,
    Equipment: [
      { Name: "Mixing A", Kind: KIND.MixingA, Kw: 0.25, Hours: 0.5, Qty: 2, RunsPerDayOverride: null },

      { Name: "Cir. Pump A", Kind: KIND.Continuous, Kw: 0.33, Hours: 18, Qty: 1, RunsPerDayOverride: null },
      { Name: "Cir. Pump B", Kind: KIND.Continuous, Kw: 0.33, Hours: 18, Qty: 1, RunsPerDayOverride: null },
    ],
    PmPerYear: 160000, WarrantyYears: 4, HorizonYears: 10,
  };
}
const PRESETS = {
  // ตัวเลขสมมติ (ตรงกับ Presets.Sample1 / Sample2 ในโปรแกรม C#)
  S1: () => build("ตัวอย่าง หน่วยไตเทียม 28 เครื่อง", "ตัวอย่าง 1", "", 28, 2900, 450, 1200, 150, 170, 2000, 60, 55, 2600000),
  S2: () => build("ตัวอย่าง หน่วยไตเทียม 36 เครื่อง", "ตัวอย่าง 2", "", 36, 3000, 700, 1100, 150, 130, 2200, 60, 55, 2700000),
  Blank: () => build("", "", "", 0, 0, 0, 0, 0, 0, 0, 60, 55, 0),
};

// ---------------- ตัวคำนวณ ----------------
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const div = (a, b) => (b === 0 ? 0 : a / b);
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const ceil = v => Math.ceil(v - 1e-9);
// Treatment ของสูตร A: กรอกเอง หรือ (ว่าง) = แกลลอนสูตรนี้ ÷ แกลลอน A รวม × Treatment/เดือน
const hasTx = r => r.Treatments !== null && r.Treatments !== undefined && r.Treatments !== "";
const autoTx = (r, totalA, t) => div(n(r.Gallons), totalA) * t;

const MODE_LITERS = 1;
// ดอกเบี้ย Flat ต่อปี ตามจำนวนปีผ่อน (ตรงกับ Services/LeasingRates.cs) — เลือกอย่างหนึ่ง อีกอย่างเปลี่ยนตาม
const LEASING_RATES = [[1, 2.85], [2, 3.25], [3, 3.50], [4, 3.60], [5, 3.55]];
const rateFor = y => (LEASING_RATES.find(t => t[0] === y) || [])[1];
const yearsFor = r => (LEASING_RATES.find(t => Math.abs(t[1] - r) < 1e-9) || [])[0];
// ไอคอนเส้น 24×24 (ชุดเดียวกับ Components/Icon.razor)
const ICON = {
  powder: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/><path d="M8 5.25l8 4.5v3"/></svg>',
  gallon: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 8V5.2a1.2 1.2 0 0 1 1.2-1.2h5.1a1.2 1.2 0 0 1 1.2 1.2V8"/><path d="M5 8l-.8-3.5h2.6L7.5 8"/><rect x="4" y="8" width="16" height="12.5" rx="2"/></svg>',
};
/** โหมดลิตร/Treatment: แกลลอน = ลิตร/Tx × Treatment ÷ ลิตรต่อแกลลอน (Treatment สูตร A ที่ว่าง = 0) */
function toGallons(i) {
  if (n(i.UsageMode) !== MODE_LITERS) return i;
  const c = JSON.parse(JSON.stringify(i));
  c.ARecipes.forEach(r => {
    if (!hasTx(r)) r.Treatments = 0;
    r.Gallons = div(n(r.LitersPerTreatment) * n(r.Treatments), n(i.LiterPerGallonA));
  });
  c.GallonsB = div(n(i.LitersPerTreatmentB) * n(i.TreatmentsPerMonth), n(i.LiterPerGallonB));
  c.UsageMode = 0;
  return c;
}
const round = (v, dp) => Math.round(v * 10 ** dp) / 10 ** dp;
/** สลับโหมดการกรอก โดยแปลงค่าเดิมให้ผลคำนวณเท่าเดิม */
function switchMode(i, mode) {
  if (n(i.UsageMode) === mode) return;
  if (mode === MODE_LITERS) {
    const totalA = sum(i.ARecipes, r => n(r.Gallons));
    i.ARecipes.forEach(r => {
      const tx = hasTx(r) ? n(r.Treatments) : round(autoTx(r, totalA, n(i.TreatmentsPerMonth)), 0);
      r.Treatments = tx;
      r.LitersPerTreatment = round(div(n(r.Gallons) * n(i.LiterPerGallonA), tx), 2);
    });
    i.LitersPerTreatmentB = round(div(n(i.GallonsB) * n(i.LiterPerGallonB), n(i.TreatmentsPerMonth)), 2);
  } else {
    const g = toGallons(i);
    i.ARecipes.forEach((r, k) => { r.Gallons = round(g.ARecipes[k].Gallons, 0); });
    i.GallonsB = round(g.GallonsB, 0);
  }
  i.UsageMode = mode;
}

function calculate(input) {
  const i = toGallons(input);
  const t = n(i.TreatmentsPerMonth);
  const totalA = sum(i.ARecipes, r => n(r.Gallons));
  const glB = n(i.GallonsB);

  // 1) แบบ GL
  const aRows = i.ARecipes.map(r => ({ Name: r.Name, Gallons: n(r.Gallons), Treatments: hasTx(r) ? n(r.Treatments) : autoTx(r, totalA, t) }));
  const avgA = div(totalA, t), avgB = div(glB, t);
  const literA = avgA * n(i.LiterPerGallonA), literB = avgB * n(i.LiterPerGallonB);
  const glCostA = totalA * n(i.PricePerGallonA), glCostB = glB * n(i.PricePerGallonB);
  const totalGl = totalA + glB;
  const glSale = totalGl * n(i.GallonSalePrice);
  const glNet = glCostA + glCostB - glSale;

  // 2) Leasing (Flat)
  const years = Math.trunc(n(i.InstallmentYears));
  const interest = n(i.LeasingPrice) * n(i.InterestRatePercent) / 100 * years;
  const leasingTotal = n(i.LeasingPrice) + interest;
  const leasingMonth = div(leasingTotal, years * 12);

  // 3) ผงผสม
  const powder = (name, p, lpt) => {
    const literPerBox = n(p.MixPerBox) * n(p.MixLiter);
    const treatPerBox = div(literPerBox, lpt);
    return { Name: name, CostPerBox: n(p.CostPerBox), MixPerBox: n(p.MixPerBox), MixLiter: n(p.MixLiter),
             LiterPerBox: literPerBox, TreatmentsPerBox: treatPerBox, CostPerTreat: div(n(p.CostPerBox), treatPerBox) };
  };
  const powderA = powder("A", i.PowderA, literA), powderB = powder("B", i.PowderB, literB);

  // 4) CCDS
  const ccdsRows = i.ARecipes.map((rec, k) => {
    const tr = aRows[k].Treatments;
    return rec.UsePowder
      ? { Name: rec.Name, IsPowder: true, Gallons: 0, Treatments: tr, PricePerGallon: 0, CostPerTreat: powderA.CostPerTreat,
          CostPerMonth: tr * powderA.CostPerTreat, MixedLiters: tr * literA }
      : { Name: rec.Name, IsPowder: false, Gallons: n(rec.Gallons), Treatments: tr, PricePerGallon: n(i.CcdsPricePerGallonA),
          CostPerTreat: div(n(rec.Gallons) * n(i.CcdsPricePerGallonA), tr), CostPerMonth: n(rec.Gallons) * n(i.CcdsPricePerGallonA), MixedLiters: 0 };
  });
  ccdsRows.push({ Name: "B", IsPowder: true, Gallons: 0, Treatments: t, PricePerGallon: 0, CostPerTreat: powderB.CostPerTreat,
                  CostPerMonth: t * powderB.CostPerTreat, MixedLiters: t * literB });
  const powderCost = sum(ccdsRows.filter(r => r.IsPowder), r => r.CostPerMonth);
  const otherGlCost = sum(ccdsRows.filter(r => !r.IsPowder), r => r.CostPerMonth);
  const otherGallons = sum(ccdsRows.filter(r => !r.IsPowder), r => r.Gallons);
  const ccdsGlSale = otherGallons * n(i.GallonSalePrice);
  const litersA = sum(ccdsRows.filter(r => r.IsPowder && r.Name !== "B"), r => r.MixedLiters);
  const litersB = t * literB;
  const litersTotal = litersA + litersB;

  // 5) Utility
  const waterM3 = litersTotal * n(i.WaterM3Per1000Liter) / 1000;
  const waterCost = waterM3 * n(i.WaterRate);
  const days = Math.max(Math.trunc(n(i.DaysPerMonth)), 1);
  const autoA = ceil(div(litersA / days, n(i.MixTankLiterA)));
  const autoB = ceil(div(litersB / days, n(i.MixTankLiterB)));
  const eqRows = i.Equipment.map(e => {
    const ov = e.RunsPerDayOverride;
    const runs = (ov !== null && ov !== undefined && ov !== "") ? n(ov)
      : e.Kind === KIND.MixingA ? autoA : e.Kind === KIND.MixingB ? autoB : 1;
    const perDay = n(e.Kw) * n(e.Hours) * n(e.Qty) * runs;
    return { Name: e.Name, Kw: n(e.Kw), Hours: n(e.Hours), Qty: n(e.Qty), RunsPerDay: runs, KwhPerDay: perDay, KwhPerMonth: perDay * days };
  });
  const kwh = sum(eqRows, e => e.KwhPerMonth);
  const electricCost = kwh * n(i.ElectricRate);
  const utility = waterCost + electricCost;
  const utilityCounted = i.IncludeUtility === false ? 0 : utility;   // "ไม่นำมาคิด" = แสดงอย่างเดียว
  const ccdsNet = leasingMonth + powderCost + otherGlCost + utilityCounted - ccdsGlSale;

  // 6) ระยะยาว
  const saving = glNet - ccdsNet;
  const ny = Math.max(years, 0);
  const warranty = Math.trunc(n(i.WarrantyYears));
  const pm = n(i.PmPerYear);
  const savingLease = saving * 12 * ny;
  const pmLease = Math.max(0, ny - warranty) * pm;
  const monthAfter = saving + leasingMonth - pm / 12;
  const yearRows = [];
  let cum = 0;
  for (let y = 1; y <= Math.max(Math.trunc(n(i.HorizonYears)), 1); y++) {
    const s = saving * 12, p = y > warranty ? pm : 0, freed = y > ny ? leasingMonth * 12 : 0;
    const net = s - p + freed;
    cum += net;
    yearRows.push({ Year: y, Saving: s, Pm: p, LeasingFreed: freed, Net: net, Cumulative: cum });
  }

  // ปีคืนทุน = ปีแรกที่ยอดสะสมเป็นบวกและเป็นบวกต่อเนื่องจนจบช่วงวิเคราะห์ (ตรงกับ C#)
  let breakEven = null;
  for (let k = yearRows.length - 1; k >= 0 && yearRows[k].Cumulative > 0; k--) breakEven = yearRows[k].Year;

  return {
    Input: input, Treatments: t, ARows: aRows, TotalGallonsA: totalA, GallonsB: glB, TotalGallons: totalGl,
    AvgGallonPerTreatA: avgA, AvgGallonPerTreatB: avgB, LiterPerTreatA: literA, LiterPerTreatB: literB,
    GlCostPerTreatA: avgA * n(i.PricePerGallonA), GlCostPerTreatB: avgB * n(i.PricePerGallonB),
    GlCostMonthA: glCostA, GlCostMonthB: glCostB, GlCostMonth: glCostA + glCostB, GlSaleRevenue: glSale, GlNetMonth: glNet,
    LeasingTotalInterest: interest, LeasingTotal: leasingTotal, LeasingPerMonth: leasingMonth,
    PowderA: powderA, PowderB: powderB, CcdsRows: ccdsRows, CcdsPowderCost: powderCost, CcdsOtherGlCost: otherGlCost,
    CcdsOtherGallons: otherGallons, CcdsGlSaleRevenue: ccdsGlSale, MixedLitersA: litersA, MixedLitersB: litersB, MixedLitersTotal: litersTotal,
    WaterM3: waterM3, WaterCost: waterCost, EquipmentRows: eqRows, ElectricKwh: kwh, ElectricCost: electricCost, UtilityCost: utility, UtilityCostCounted: utilityCounted,
    CcdsNetMonth: ccdsNet, SavingPerMonth: saving, GlCostPerTreatment: div(glNet, t), CcdsCostPerTreatment: div(ccdsNet, t),
    SavingDuringLease: savingLease, PmDuringLease: pmLease, SavingDuringLeaseAfterPm: savingLease - pmLease,
    SavingPerMonthAfterLease: monthAfter, SavingPerYearAfterLease: monthAfter * 12, SavingHorizon: cum,
    Years: yearRows, BreakEvenYear: breakEven,
  };
}

// ---------------- รูปแบบตัวเลข ----------------
const fmt = dp => new Intl.NumberFormat("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const F0 = fmt(0), F1 = fmt(1), F2 = fmt(2);
const fix0 = v => (Math.abs(v) < 0.5 ? 0 : v);           // ป้องกัน "-0"
const N0 = v => F0.format(fix0(v));
const N1 = v => F1.format(Math.abs(v) < 0.05 ? 0 : v);
const N2 = v => F2.format(Math.abs(v) < 0.005 ? 0 : v);
const Signed = (v, dp = 0) => { const s = dp ? N2(v) : N0(v); return (Number(s.replace(/,/g, "")) > 0 ? "+" : "") + s; };
const Pct = (part, whole) => whole === 0 ? "-" : ((part / whole >= 0 ? "+" : "") + (part / whole * 100).toFixed(1) + "%");
const cls = v => (v >= 0 ? "pos" : "neg");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dash = s => (String(s ?? "").trim() === "" ? "-" : esc(s));
const short = v => {
  const a = Math.abs(v);
  const s = a >= 1e6 ? (v / 1e6).toFixed(2) + "M" : a >= 1e3 ? (v / 1e3).toFixed(0) + "K" : v.toFixed(0);
  return v > 0 ? "+" + s : s;
};

function loadInitial() {
  if (window.CCDS_INPUT) return normalize(window.CCDS_INPUT);
  try { const s = localStorage.getItem(STORE_KEY); if (s) return normalize(JSON.parse(s)); } catch (e) { /* ignore */ }
  return PRESETS.S1();
}
function normalize(o) {
  const base = PRESETS.Blank();
  const x = Object.assign(base, o || {});
  x.PowderA = Object.assign(PRESETS.Blank().PowderA, x.PowderA || {});
  x.PowderB = Object.assign(PRESETS.Blank().PowderB, x.PowderB || {});
  x.ARecipes = (Array.isArray(x.ARecipes) ? x.ARecipes : [])
    .map(r => Object.assign({ Name: "", Gallons: 0, UsePowder: false, Treatments: null, LitersPerTreatment: 0 }, r));
  x.Equipment = Array.isArray(x.Equipment) ? x.Equipment : [];
  return x;
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(input)); } catch (e) { /* ignore */ } }
function message(t) { document.getElementById("msg").textContent = t || ""; }

function updateFormCalcs(r) {
  r.ARows.forEach((a, k) => setText(`c-gl-${k}`, N0(a.Gallons)));
  setText("c-gl-b", N0(r.GallonsB));
  const totalA = sum(input.ARecipes, x => n(x.Gallons));
  input.ARecipes.forEach((rec, k) => {
    const el = document.getElementById(`c-treat-${k}`);
    if (el) el.placeholder = N0(autoTx(rec, totalA, n(input.TreatmentsPerMonth)));
  });
  const sumA = sum(r.ARows, a => a.Treatments), warn = document.getElementById("c-tx-warn");
  if (warn) {
    warn.hidden = Math.abs(sumA - r.Treatments) < 0.5;
    warn.innerHTML = `Treatment สูตร A รวม <b>${N0(sumA)}</b> ไม่เท่ากับ Treatment / เดือนในข้อ 1 (<b>${N0(r.Treatments)}</b>) — โปรแกรมยังคำนวณต่อได้ แต่ควรตรวจตัวเลขอีกครั้ง`;

  setText("c-total-gl", N0(r.TotalGallons));

function compareBars(r) {
  const gl = [["น้ำยา A (GL)", r.GlCostMonthA, "#3B6EA5"], ["น้ำยา B (GL)", r.GlCostMonthB, "#7FA7D1"]];
  const cc = [["Leasing", r.LeasingPerMonth, "#0F766E"], ["ผงผสม", r.CcdsPowderCost, "#14B8A6"],
              ["A แบบ GL", r.CcdsOtherGlCost, "#99D5CC"], ...(r.Input.IncludeUtility === false ? [] : [["Utility", r.UtilityCost, "#F59E0B"]])];
  const tGl = sum(gl, x => x[1]), tCc = sum(cc, x => x[1]);
  const max = Math.max(tGl, tCc) || 1;
  const stack = parts => `<div class="stack">${parts.filter(p => p[1] > 0).map(p => `<div style="width:${p[1] / max * 100}%;background:${p[2]}"></div>`).join("")}</div>`;
  return `
    <div class="stack-l">แบบ GL <span>&nbsp; ${N0(tGl)}</span></div>${stack(gl)}
    <div class="stack-l" style="margin-top:3mm">แบบ CCDS <span>&nbsp; ${N0(tCc)}</span></div>${stack(cc)}
    <div class="legend">${gl.concat(cc).map(p => `<span><i style="background:${p[2]}"></i>${p[0]}</span>`).join("")}</div>
    <div class="legend">* ยอดก่อนหักรายได้ขายแกลลอนเปล่าคืน</div>`;
}

function yearChart(r) {
  const H = 110;
  const maxPos = Math.max(0, ...r.Years.map(y => y.Cumulative));
  const maxNeg = Math.max(0, ...r.Years.map(y => -y.Cumulative));
  const span = (maxPos + maxNeg) || 1;
  const hPos = maxPos / span * H, hNeg = H - hPos;
  const ny = n(r.Input.InstallmentYears);
  const cols = r.Years.map(y => {
    const bar = Math.max(Math.abs(y.Cumulative) / span * H, 0.8);
    const lease = y.Year <= ny;
    // ไล่สี: ปลายแท่งอ่อน → ฐานเข้ม (ช่วงผ่อนเครื่องใช้โทนอ่อนกว่า) — ตรงกับ YearChart.razor
    const color = y.Cumulative >= 0
      ? (lease ? "linear-gradient(180deg,#a7e3c0,#4cb97a)" : "linear-gradient(180deg,#5fd496,#15803d)")
      : (lease ? "linear-gradient(0deg,#f9c2c2,#ef7b7b)" : "linear-gradient(0deg,#f59a9a,#c62828)");
    return `<div class="yc">
      ${hPos > 0.5 ? `<div class="zone p" style="height:${hPos}px">${y.Cumulative > 0 ? `<div style="height:${bar}px;background:${color}"></div>` : ""}</div>` : ""}
      <div class="zero"></div>
      ${hNeg > 0.5 ? `<div class="zone n" style="height:${hNeg}px">${y.Cumulative < 0 ? `<div style="height:${bar}px;background:${color}"></div>` : ""}</div>` : ""}
      <div class="lab">ปี ${y.Year}</div><div class="val ${cls(y.Cumulative)}">${short(y.Cumulative)}</div></div>`;
  }).join("");
  return `<div class="ychart"><div class="cols-y">${cols}</div>
    <div class="cap">แท่ง = ยอดสะสม • สีอ่อน = ช่วงผ่อนชำระ, สีเข้ม = หลังผ่อนครบ • M = ล้านบาท, K = พันบาท</div></div>`;
}

function yearTable(r) {
  // ตรงกับ YearTable.razor: สุทธิรายปีตั้งแต่ปีคืนทุน = เขียว (ปีที่เริ่มคืนทุนมีพื้นเขียวอ่อน), สะสม = น้ำเงิน
  const be = r.BreakEvenYear;
  const lines = [["saving", "Saving ค่าใช้จ่าย", y => y.Saving], ["pm", "หัก ค่า PM", y => -y.Pm],
                 ["freed", "ไม่ต้องจ่าย Leasing", y => y.LeasingFreed], ["net", "สุทธิรายปี", y => y.Net], ["cum", "สะสม", y => y.Cumulative]];
  const cellCls = (key, y, v) => v <= -0.5 ? "neg"
    : key === "net" && be && y.Year >= be && v >= 0.5 ? (y.Year === be ? "pos be" : "pos")
    : key === "cum" && v >= 0.5 ? "cum" : "";
  return `<table class="rt small yt">
    <thead><tr><th class="l">บาท</th>${r.Years.map(y => `<th class="${y.Year === be ? "be-h" : ""}">ปี ${y.Year}</th>`).join("")}</tr></thead>
    <tbody>${lines.map(([key, label, f]) => `<tr class="${key}"><td class="l">${label}</td>${r.Years.map(y => {
      const v = f(y); return `<td class="${cellCls(key, y, v)}">${Math.abs(v) < 0.5 ? "-" : N0(v)}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table>`;
}

  const i = r.Input;
  return `<table class="rt">
    <thead><tr><th class="l">สูตร</th><th>แกลลอน</th><th>Treatment</th><th>GL / Tx</th><th>ลิตร / Tx</th><th>ราคา / GL</th><th>บาท / Tx</th><th>บาท / เดือน</th></tr></thead>
    <tbody>
      ${r.ARows.map(a => {
        const gpt = div(a.Gallons, a.Treatments), pa = n(i.PricePerGallonA);
        return `<tr>${td(esc(a.Name), "l")}${td(N0(a.Gallons))}${td(N0(a.Treatments))}${td(N2(gpt))}${td(N2(gpt * n(i.LiterPerGallonA)))}${td(N2(pa))}${td(N2(gpt * pa))}${td(N0(a.Gallons * pa))}</tr>`;
      }).join("")}
      <tr class="sub">${td("รวม A", "l")}${td(N0(r.TotalGallonsA))}${td(N0(r.Treatments))}${td(N2(r.AvgGallonPerTreatA))}${td(N2(r.LiterPerTreatA))}${td(N2(n(i.PricePerGallonA)))}${td(N2(r.GlCostPerTreatA))}${td(N0(r.GlCostMonthA))}</tr>
      <tr class="sub">${td("B", "l")}${td(N0(r.GallonsB))}${td(N0(r.Treatments))}${td(N2(r.AvgGallonPerTreatB))}${td(N2(r.LiterPerTreatB))}${td(N2(n(i.PricePerGallonB)))}${td(N2(r.GlCostPerTreatB))}${td(N0(r.GlCostMonthB))}</tr>
      <tr class="tot">${td("รวม", "l")}${td(N0(r.TotalGallons))}<td></td><td></td><td></td><td></td>${td(N2(r.GlCostPerTreatA + r.GlCostPerTreatB))}${td(N0(r.GlCostMonth))}</tr>
    </tbody></table>`;
}

function ccdsTable(r) {
  return `<table class="rt">
    <thead><tr><th class="l">สูตร</th><th class="l">ใช้</th><th>แกลลอน</th><th>Treatment</th><th>ราคา / GL</th><th>บาท / Tx</th><th>บาท / เดือน</th><th>ลิตรผสม</th></tr></thead>
    <tbody>
      ${r.CcdsRows.map(x => `<tr>${td(esc(x.Name), "l")}<td class="l"><span class="tag ${x.IsPowder ? "powder" : "gl"}">${x.IsPowder ? "ผงผสม" : "แกลลอน"}</span></td>
        ${td(x.IsPowder ? "-" : N0(x.Gallons))}${td(N0(x.Treatments))}${td(x.IsPowder ? "-" : N2(x.PricePerGallon))}${td(N2(x.CostPerTreat))}${td(N0(x.CostPerMonth))}${td(x.IsPowder ? N0(x.MixedLiters) : "-")}</tr>`).join("")}
      <tr class="tot">${td("รวม", "l")}<td></td>${td(N0(r.CcdsOtherGallons))}${td(N0(r.Treatments))}<td></td><td></td>${td(N0(r.CcdsPowderCost + r.CcdsOtherGlCost))}${td(N0(r.MixedLitersTotal))}</tr>
    </tbody></table>`;
}

function utilityTables(r) {
  const i = r.Input;
  return `<table class="rt">
      <thead><tr><th class="l">Utility</th><th>บาท / หน่วย</th><th>ใช้ / เดือน</th><th>บาท / เดือน</th></tr></thead>
      <tbody>
        <tr>${td("ค่าน้ำ (m³)", "l")}${td(N2(n(i.WaterRate)))}${td(N1(r.WaterM3))}${td(N0(r.WaterCost))}</tr>
        <tr>${td("ค่าไฟฟ้า (kWh)", "l")}${td(N2(n(i.ElectricRate)))}${td(N0(r.ElectricKwh))}${td(N0(r.ElectricCost))}</tr>
        <tr class="tot"><td class="l" colspan="3">รวม Utility / เดือน</td>${td(N0(r.UtilityCost))}</tr>
      </tbody></table>
    <div class="foot-note" style="font-size:7pt">น้ำ = ลิตรผสม ${N0(r.MixedLitersTotal)} × ${N2(n(i.WaterM3Per1000Liter))} m³ / 1,000 ลิตร</div>
    <table class="rt small" style="margin-top:1.5mm">
      <thead><tr><th class="l">อุปกรณ์</th><th>kW</th><th>ชม./รอบ</th><th>จำนวน</th><th>รอบ/วัน</th><th>kWh/วัน</th><th>kWh/เดือน</th></tr></thead>
      <tbody>${r.EquipmentRows.map(e => `<tr>${td(esc(e.Name), "l")}${td(N2(e.Kw))}${td(N1(e.Hours))}${td(N0(e.Qty))}${td(N0(e.RunsPerDay))}${td(N2(e.KwhPerDay))}${td(N1(e.KwhPerMonth))}</tr>`).join("")}
        <tr class="tot"><td class="l" colspan="6">รวม kWh / เดือน (${Math.max(Math.trunc(n(i.DaysPerMonth)), 1)} วัน)</td>${td(N0(r.ElectricKwh))}</tr>
      </tbody></table>`;
}

function summaryPage(r) {
  const i = r.Input, ny = n(i.InstallmentYears);
  return `
    <div class="r-kpis">
      ${rKpi("ค่าใช้จ่ายแบบ GL (ปัจจุบัน)", N0(r.GlNetMonth), "บาท/เดือน", `${N2(r.GlCostPerTreatment)} บาท/Treatment`, "navy")}
      ${rKpi("ค่าใช้จ่ายแบบ CCDS", N0(r.CcdsNetMonth), "บาท/เดือน", `${N2(r.CcdsCostPerTreatment)} บาท/Treatment`, "teal")}
      ${rKpi("Cost Saving ช่วงผ่อน", Signed(r.SavingPerMonth), "บาท/เดือน", `${Pct(r.SavingPerMonth, r.GlNetMonth)} ของค่าใช้จ่ายเดิม`, cls(r.SavingPerMonth))}
      ${rKpi(`Cost Saving สะสม ${esc(i.HorizonYears)} ปี`, Signed(r.SavingHorizon), "บาท",
             r.BreakEvenYear ? `คืนทุน/เริ่มกำไรสะสมปีที่ ${r.BreakEvenYear}` : "ยังไม่คืนทุนในช่วงที่วิเคราะห์", cls(r.SavingHorizon))}
    </div>
    <div class="verdict ${cls(r.SavingHorizon)}">
      <div class="h">ข้อสรุป</div>
      <div style="color:var(--text)">ช่วงผ่อนชำระ ${ny} ปีแรก ระบบ CCDS <b>${r.SavingPerMonth >= 0 ? "ประหยัดกว่า" : "มีค่าใช้จ่ายสูงกว่า"}</b>
        แบบ GL เดือนละ ${N0(Math.abs(r.SavingPerMonth))} บาท • เมื่อผ่อนครบจะเริ่ม${r.SavingPerMonthAfterLease >= 0 ? "ประหยัด" : "ขาดทุน"}ปีที่ ${ny + 1}
        <b>เดือนละ ${N2(Math.abs(r.SavingPerMonthAfterLease))} บาท</b> (หักค่า PM แล้ว) •
        ครบ ${esc(i.HorizonYears)} ปี Cost Saving สุทธิ <b class="${cls(r.SavingHorizon)}">${Signed(r.SavingHorizon, 2)} บาท</b></div>
    </div>
    <div class="cols" style="grid-template-columns: 11fr 9fr">
      <div>${sec("เปรียบเทียบค่าใช้จ่ายต่อเดือน")}${compareTable(r)}</div>
      <div>${sec("สัดส่วนค่าใช้จ่าย (บาท/เดือน)")}${compareBars(r)}</div>
    </div>
    <div>
      ${sec(`ผลตอบแทนระยะยาว ${esc(i.HorizonYears)} ปี (Cost Saving สะสม)`)}
      <div class="cols" style="grid-template-columns: 9fr 11fr">${longTermFacts(r)}${yearChart(r)}</div>
      <div style="margin-top:2mm">${yearTable(r)}</div>
    </div>
    `;
}

function detailPage(r) {
  const i = r.Input;
  const inc = i.IncludeUtility !== false;   // "ไม่นำมาคิด" = ไม่แสดงหัวข้อค่า Utility
  const pa = r.PowderA, pb = r.PowderB;
  return `
    <div>${sec(`1. ปริมาณน้ำยาและค่าใช้จ่ายแบบแกลลอน (GL) — ${N0(r.Treatments)} Treatment/เดือน`)}${glTable(r)}
      ${n(i.UsageMode) === MODE_LITERS ? `<div class="foot-note">แกลลอนคำนวณจากปริมาณที่ใช้จริง: ลิตร/Treatment × Treatment ÷ ลิตรต่อแกลลอน (A ${N1(n(i.LiterPerGallonA))} L, B ${N1(n(i.LiterPerGallonB))} L)</div>` : ""}
      <div class="foot-note">ขายแกลลอนเปล่าคืน ${N0(r.TotalGallons)} GL × ${N2(n(i.GallonSalePrice))} = ${N0(r.GlSaleRevenue)} บาท →
        <b>ค่าใช้จ่ายสุทธิแบบ GL ${N0(r.GlNetMonth)} บาท/เดือน</b></div></div>
    <div class="cols" style="grid-template-columns: 1fr 1fr">
      <div>${sec(`2. ค่าเช่าซื้อเครื่อง CCDS (${N0(n(i.Machines))} เครื่อง)`)}
        ${kv([["ราคาเครื่อง", N0(n(i.LeasingPrice))], ["ดอกเบี้ย (Flat) / ปี", `${+n(i.InterestRatePercent).toFixed(2)}%`],
              ["จำนวนปีผ่อน", `${esc(i.InstallmentYears)} ปี (${n(i.InstallmentYears) * 12} งวด)`],
              ["ดอกเบี้ยรวม", N0(r.LeasingTotalInterest)], ["ยอดรวมทั้งสิ้น", N0(r.LeasingTotal)]],
             ["ค่างวด / เดือน", N2(r.LeasingPerMonth)])}</div>
      <div>${sec("3. ต้นทุนผงผสมต่อ Treatment")}
        <table class="rt"><thead><tr><th class="l">รายการ</th><th>ผง A</th><th>ผง B</th></tr></thead><tbody>
          <tr>${td("ราคา / กล่อง", "l")}${td(N2(pa.CostPerBox))}${td(N2(pb.CostPerBox))}</tr>
          <tr>${td("ผสมได้ (ครั้ง/กล่อง)", "l")}${td(N0(pa.MixPerBox))}${td(N0(pb.MixPerBox))}</tr>
          <tr>${td("ลิตร / ครั้งผสม", "l")}${td(N2(pa.MixLiter))}${td(N2(pb.MixLiter))}</tr>
          <tr>${td("ลิตร / กล่อง", "l")}${td(N0(pa.LiterPerBox))}${td(N0(pb.LiterPerBox))}</tr>
          <tr>${td("ลิตร / Treatment", "l")}${td(N2(r.LiterPerTreatA))}${td(N2(r.LiterPerTreatB))}</tr>
          <tr>${td("Treatment / กล่อง", "l")}${td(N2(pa.TreatmentsPerBox))}${td(N2(pb.TreatmentsPerBox))}</tr>
          <tr class="tot">${td("ต้นทุน / Treatment", "l")}${td(N2(pa.CostPerTreat))}${td(N2(pb.CostPerTreat))}</tr>
        </tbody></table></div>
    </div>
    <div>${sec("4. ค่าน้ำยาเมื่อใช้ระบบ CCDS (ผงผสม + สูตรที่ยังใช้แกลลอน)")}${ccdsTable(r)}</div>
    <div class="cols" style="grid-template-columns: ${inc ? "11fr 8fr" : "1fr 1fr"}">
      ${inc ? `<div>${sec("5. ค่า Utility")}${utilityTables(r)}</div>` : ""}
      <div>${sec(`${inc ? 6 : 5}. ค่าใช้จ่ายระบบ CCDS (${N0(r.Treatments)} Tx/เดือน)`)}
        ${kv([[`Leasing ${esc(i.InstallmentYears)} ปี`, N0(r.LeasingPerMonth)], ["ผงผสม " + powderNames(r), N0(r.CcdsPowderCost)],
              [glNames(r) + " แบบ GL", N0(r.CcdsOtherGlCost)], ...(inc ? [["Utility (น้ำ + ไฟ)", N0(r.UtilityCost)]] : []),
              ["หัก ขายแกลลอนคืน", N0(-r.CcdsGlSaleRevenue)]], ["รวม / เดือน", N0(r.CcdsNetMonth)])}</div>
    </div>`;
}

function renderReport(r) {
  const html = pageShell(r, "", summaryPage(r), 1, 2)
             + pageShell(r, "รายละเอียดการคำนวณ", detailPage(r), 2, 2);
  document.getElementById("report").innerHTML = html;
}

// =====================================================================
// ควบคุมหน้าจอ
// =====================================================================

function refresh() {
  const r = calculate(input);
  if (view === "edit") { updateFormCalcs(r); renderResults(r); }
  else renderReport(r);
  const base = ["CCDS", input.ModelName, input.Month].filter(x => String(x || "").trim()).join(" ");
  document.title = base === "CCDS" ? "CCDS Feasibility Simulator" : `${base} — Feasibility Study`;
}
function setView(v) {
  view = v;
  document.getElementById("edit-view").hidden = v !== "edit";
  document.getElementById("report-view").hidden = v !== "report";
  document.querySelectorAll('[data-action="view"]').forEach(b => b.classList.toggle("on", b.dataset.view === v));
  if (v === "edit") renderForm();
  refresh();
  window.scrollTo(0, 0);
}
function replaceInput(x, note) { input = normalize(x); persist(); message(note); setView(view); }

function setPath(obj, path, value) {
  const keys = path.split(".");
  let o = obj;
  for (let k = 0; k < keys.length - 1; k++) o = o[keys[k]];
  o[keys[keys.length - 1]] = value;
}

document.getElementById("form").addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.link) {   // ดอกเบี้ย ↔ ปีผ่อน: ค่าตรงกับตาราง อีกช่องเปลี่ยนตาม, พิมพ์ค่าอื่นได้เอง
    if (el.value === "") return;
    if (el.dataset.link === "rate") {
      input.InterestRatePercent = Number(el.value);
      const y = yearsFor(input.InterestRatePercent);
      if (y !== undefined) { input.InstallmentYears = y; document.getElementById("in-years").value = y; }
    } else {
      input.InstallmentYears = Math.max(0, Math.round(Number(el.value)));
      const r = rateFor(input.InstallmentYears);
      if (r !== undefined) { input.InterestRatePercent = r; document.getElementById("in-rate").value = r; }
    }
    persist(); refresh();   // ไม่วาดฟอร์มใหม่ เคอร์เซอร์จะได้ไม่หลุดระหว่างพิมพ์
    return;
  }
  const path = el.dataset.path;
  if (!path) return;
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (el.type === "number") v = el.value === "" ? (/RunsPerDayOverride$|\.Treatments$/.test(path) ? null : 0) : Number(el.value);
  else v = el.value;
  setPath(input, path, v);
  persist();
  refresh();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const k = Number(b.dataset.k);
  switch (b.dataset.action) {
    case "view": setView(b.dataset.view); break;
    case "preset": replaceInput(PRESETS[b.dataset.preset](), ""); break;
    case "mode": switchMode(input, Number(b.dataset.v)); persist(); renderForm(); refresh(); break;
    case "utility": input.IncludeUtility = b.dataset.v === "1"; persist(); renderForm(); refresh(); break;
    case "powder": input.ARecipes[k].UsePowder = b.dataset.v === "1"; persist(); renderForm(); refresh(); break;
    case "remove": input.ARecipes.splice(k, 1); persist(); renderForm(); refresh(); break;
    case "add": input.ARecipes.push({ Name: "A" + (input.ARecipes.length + 1), Gallons: 0, UsePowder: false, Treatments: null, LitersPerTreatment: 0 }); persist(); renderForm(); refresh(); break;
    case "save": {
      const blob = new Blob([JSON.stringify(input, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = ["CCDS", input.ModelName, input.Month].filter(x => String(x || "").trim()).join("_").replace(/[\\/:*?"<>|]/g, "_") + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case "print": if (view !== "report") setView("report"); setTimeout(() => window.print(), 300); break;
  }
});

document.getElementById("file-in").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { replaceInput(JSON.parse(await f.text()), `โหลดข้อมูลจาก ${f.name} แล้ว`); }
  catch (err) { message("อ่านไฟล์ไม่สำเร็จ: " + err.message); }
  e.target.value = "";
});

setView(view);
</script>
</body>
</html>
